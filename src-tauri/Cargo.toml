[package]
name = "droidlog"
version = "0.1.0"
description = "Android log collection desktop app (ADB / Root)"
authors = ["droidlog"]
edition = "2021"
# 1.82 is where `Option::is_none_or` (used by the device poller) stabilised.
# Declared honestly rather than contorting the code to satisfy a lower bound we
# do not actually test against; Tauri 2 itself only needs 1.77.
rust-version = "1.82"

[lib]
# `_lib` avoids a name collision with the binary on Windows.
name = "droidlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "rt-multi-thread",
    "macros",
    "time",
] }

[features]
# Used for production builds or when a dev server is not specified.
# Do not remove — the Tauri CLI enables it for `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Faster iteration during `cargo tauri dev`.
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
